version: "3.1"
services:
    www:
        build:
            context: ..
            dockerfile: docker_app_certbot/php/Dockerfile
            args:
                - DOMAIN=$DOMAIN
        command: bash -c "service cron start && apache2-foreground"
        environment:
            - DOMAIN
        ports:
            - "8080:80"
            - "443:443"
        volumes:
            - ../web:/var/www/html/
            - ../docker_app/php/config.inc.php:/var/www/html/config.inc.php
            - ./letsencrypt:/etc/letsencrypt
        links:
            - db
        networks:
            - default
    db:
        image: mysql:8.0
        ports:
            - "3306:3306"
        command: --default-authentication-plugin=mysql_native_password
        environment:
            MYSQL_DATABASE: mrbs
            MYSQL_USER: mrbs
            MYSQL_PASSWORD: mrbs
            MYSQL_ROOT_PASSWORD: mrbs
        volumes:
            - ../tables.my.sql:/docker-entrypoint-initdb.d/010-tables.sql
            - persistent:/var/lib/mysql
            - ./mysql/my.cnf:/etc/mysql/my.cnf
        networks:
            - default
    phpmyadmin:
        image: phpmyadmin
        links:
            - db:db
        ports:
            - 8888:80
volumes:
    persistent:
